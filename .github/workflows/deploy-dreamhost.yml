name: Deploy to seneternal.com

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: seneternal-dreamhost-main
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Test
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Validate build output
        run: |
          test -s apps/web/dist/index.html
          grep -q 'Seneternal' apps/web/dist/index.html

      - name: Deploy to DreamHost over SSH (rsync + deploy key)
        env:
          SSH_KEY: ${{ secrets.DREAMHOST_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Preserve older fingerprinted JS/CSS assets for tabs that were
          # already open before this deployment. Their dynamic imports (and
          # lazy game modules) must remain fetchable across releases.
          # Receiver-side 'P' prevents deletion but still uploads new assets.
          rsync -avz --delete --filter='P /assets/***' --exclude='.dh-diag' \
            -e "ssh -i ~/.ssh/deploy_key -p 22 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            apps/web/dist/ \
            "${{ secrets.DREAMHOST_SFTP_USER }}@${{ secrets.DREAMHOST_SFTP_HOST }}:/home/marcusdhaynes/seneternal.com/"
